name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python (data prep and reference model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest

  js:
    name: JS (demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm test
