[project]
name = "zombie-outbreak"
version = "0.1.0"
description = "Data preparation and reference model for the Quantifying the Quarantine demo."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mark Bugden" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "scipy>=1.14",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
